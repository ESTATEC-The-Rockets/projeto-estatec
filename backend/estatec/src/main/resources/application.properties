spring.application.name=estatec

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
estatec.frontend-origin=${ESTATEC_FRONTEND_ORIGIN:http://localhost:5500}
estatec.admin.email=${ESTATEC_ADMIN_EMAIL:}
estatec.admin.password-hash=${ESTATEC_ADMIN_PASSWORD_HASH:}
estatec.access.api-key=${ESTATEC_ACCESS_API_KEY:}
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

estatec.registration.code=${ESTATEC_REGISTRATION_CODE:}
