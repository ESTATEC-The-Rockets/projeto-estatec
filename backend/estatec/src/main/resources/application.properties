spring.application.name=estatec
spring.config.import=optional:file:./backend/estatec/.env[.properties],optional:file:${estatec.env-file:./.env}[.properties]

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

estatec.frontend-origin=${ESTATEC_FRONTEND_ORIGIN:}
estatec.admin.email=${ESTATEC_ADMIN_EMAIL:}
estatec.admin.password-hash=${ESTATEC_ADMIN_PASSWORD_HASH:}
estatec.access.api-key=${ESTATEC_ACCESS_API_KEY:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode = ${SQL_INIT_MODE:always}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
