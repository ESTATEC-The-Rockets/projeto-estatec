<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESTATEC | Administração</title>
<link rel="stylesheet" href="../css/adminCrud.css"><link rel="stylesheet" href="../css/interface.css">
<script src="../script/api-config.js"></script><script src="../script/adminCrud.js" defer></script>
</head>
<body>
<header class="topbar"><div><p class="eyebrow">ESTATEC</p><h1>Administração</h1></div><button id="logoutAdmin" class="btn-top danger">Sair</button></header>
<main class="content">
<div class="intro"><h2>Contas dos donos</h2><p>Crie o acesso dos donos. Cada dono cadastra seus estacionamentos e veículos após entrar.</p></div>
<section class="crud-section"><h2>Visão geral</h2><p id="userCount" class="count">Carregando usuários…</p><p id="parkingCount" class="count">Carregando estacionamentos…</p><p id="carCount" class="count">Carregando veículos…</p></section>
<section class="crud-section"><h2>Criar conta de dono</h2>
<form id="userForm" class="crud-form"><div class="form-grid">
<div class="field"><label for="userNome">Nome</label><input id="userNome" name="nome" required maxlength="120"></div>
<div class="field"><label for="userEmail">E-mail</label><input id="userEmail" name="email" type="email" required maxlength="120"></div>
<div class="field"><label for="userSenha">Senha inicial</label><input id="userSenha" name="senha" type="password" required minlength="8" autocomplete="new-password"></div>
<div class="field"><label for="userCpf">CPF</label><input id="userCpf" name="cpf" required></div>
<div class="field"><label for="userRg">RG</label><input id="userRg" name="rg" required minlength="7" maxlength="12"></div>
<div class="field"><label for="userTelefone">Telefone</label><input id="userTelefone" name="telefone" required></div>
<div class="field"><label for="userDataNascimento">Data de nascimento</label><input id="userDataNascimento" name="dataNascimento" type="date" required></div>
</div><div class="form-actions"><button type="submit" class="btn-save">Criar conta</button></div><p id="userStatus" class="status" role="status" aria-live="polite"></p></form></section>
<section class="crud-section"><h2>Donos cadastrados</h2><div class="table-wrapper"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th></tr></thead><tbody id="userTableBody"></tbody></table></div></section>
</main></body></html>
